[repository]
name = "hypr-shiny-border"
authors = ["wmfeht"]
# Pairs of [hyprland_commit, this_repo_commit]. hyprpm checks out the matching
# plugin commit for the running compositor; if nothing matches, it builds HEAD.
# Pins from the sibling hypr-shiny-border repo do not apply here — re-pin after
# a release on this unified tree.
commit_pins = []

[hypr-shiny-border]
description = "Gradient window border with a directional highlight"
authors = ["wmfeht"]
output = "hypr/hypr-shiny-border.so"
build = [
    "make -C hypr all",
]
