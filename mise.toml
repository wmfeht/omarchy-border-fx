# wmfeht.border-fx: Omarchy control plane for shell chrome + Hyprland window ring.
# qsb is system Qt 6 (/usr/lib/qt6/bin/qsb); do not mise-install a second Qt.
# Hyprland plugins must be built with the same GCC that built the compositor.
# The control plane (cli/) is Rust; scripts/border-fx builds it on first use.

min_version = "2025.8.0"

[tools]
node = "26.7.0"
rust = "stable"

[tasks.bake]
description = "Bake every Qt shaders/*.frag into .qsb and inline GLES shiny+ripple into hypr/src/shaders.hpp"
run = "bash dev/bake.sh"

[tasks.reflect]
description = "Bake, then dump qsb reflection (UBO layout)"
run = "bash dev/bake.sh --dump"

[tasks.cli-build]
description = "Debug build of the border-fx control plane (cli/)"
run = "cargo build --manifest-path cli/Cargo.toml"

[tasks.cli-test]
description = "Rust unit tests for the control plane (look schema, ensure/teardown flows, ABI, shell.json)"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks.cli-lint]
description = "rustfmt --check + clippy on cli/"
run = "cargo fmt --manifest-path cli/Cargo.toml --check && cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings"

[tasks.test]
description = "Compositor-free tests: Rust unit tests, then shimmer/gradient/look adapter/session install (JS)"
depends = ["cli-test"]
run = "node tests/run.js && node tests/look.js && node tests/hypr-session.js"

[tasks.lint]
description = "qmllint ShinyBorder.qml + rustfmt/clippy"
depends = ["cli-lint"]
run = "/usr/lib/qt6/bin/qmllint qml/ShinyBorder.qml"

[tasks.check]
description = "Bake the shader, lint QML + Rust, and run all compositor-free tests"
depends = ["bake", "lint", "test"]
run = "echo ok"

[tasks.preview]
description = "Standalone qs window with ShinyBorder on mock cards. Does not touch omarchy-shell."
depends = ["bake"]
run = "bash dev/preview.sh"

[tasks.smoke]
description = "Load ShinyBorder in a short-lived qs window; fail only if the shader errors"
depends = ["bake"]
env = { SHINY_SMOKE = "1" }
run = "bash dev/preview.sh"

[tasks.test-full]
description = "JS tests, qs smoke, and Hyprland logic tests"
depends = ["check"]
run = "make -C hypr test"

[tasks.install]
description = "Dev copy into ~/.config/omarchy/plugins/wmfeht.border-fx and enable (builds the CLI into $XDG_CACHE_HOME)"
depends = ["bake"]
run = "bash scripts/border-fx dev install"

[tasks.uninstall]
description = "Disable wmfeht.border-fx, purge the login-session .so, remove the copy"
run = "bash scripts/border-fx dev uninstall"

[tasks.reinstall]
description = "Remove wmfeht.border-fx, then omarchy plugin add this folder, keeping the shell.json look"
depends = ["bake"]
run = "bash scripts/border-fx dev reinstall"

[tasks.status]
description = "Control-plane diagnostics: paths, compositor state, ABI identity, current theme"
run = "bash scripts/border-fx status"

[tasks.hypr-build]
description = "Compile hypr-shiny-border.so against system Hyprland headers"
run = "make -C hypr -j$(nproc)"

[tasks.hypr-test]
description = "Compositor-free Hyprland plugin logic tests"
run = "make -C hypr test"

[tasks.hypr-clean]
description = "Remove hypr objects and the .so"
run = "make -C hypr clean"

[tasks.headers]
description = "Compare running compositor hash vs plugin headers"
run = """
echo '=== hyprctl version ==='
hyprctl version
echo
echo '=== headers ==='
grep -E 'GIT_COMMIT_HASH|GIT_TAG|GIT_BRANCH' /usr/include/hyprland/src/version.h
"""

[tasks.load]
description = "Load the .so into the nest (last instance). Refuses the live session unless SHINY_LIVE=1"
run = "hypr/scripts/pluginctl.sh load"
depends = ["hypr-build"]

[tasks.unload]
description = "Unload from $SHINY_INSTANCE"
run = "hypr/scripts/pluginctl.sh unload"

[tasks.reload]
description = "Rebuild, copy to a fresh path, unload+load (dodges dlopen cache)"
run = "hypr/scripts/pluginctl.sh reload"
depends = ["hypr-build"]

[tasks.nest]
description = "Nested Hyprland with hypr/nest/hyprland.lua — crash sandbox"
run = """
export SHINY_HYPR_ROOT="$MISE_PROJECT_ROOT/hypr"
Hyprland --config "$MISE_PROJECT_ROOT/hypr/nest/hyprland.lua"
"""
