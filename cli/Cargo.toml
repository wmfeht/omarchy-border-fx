[package]
name = "border-fx"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Control plane for the wmfeht.border-fx Omarchy plugin"
license = "MIT"
publish = false

[[bin]]
name = "border-fx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
